name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests.py -v

      - name: Smoke test — index CodeAtlas itself
        run: python codeatlas.py stats .

      - name: Smoke test — no dead code
        run: python codeatlas.py dead-code

      - name: Smoke test — no cycles
        run: python codeatlas.py cycles

      - name: Smoke test — Mermaid export
        run: python codeatlas.py graph